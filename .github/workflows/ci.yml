# Проверки на каждый пуш и пулл-реквест: формат, vet, тесты с настоящим PostgreSQL, сборка образа.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tropa
          POSTGRES_PASSWORD: tropa
          POSTGRES_DB: tropa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tropa"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TROPA_TEST_DATABASE_URL: postgres://tropa:tropa@localhost:5432/tropa_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатированы:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t tropa:ci .
