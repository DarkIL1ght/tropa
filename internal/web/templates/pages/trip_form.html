{{define "title"}}{{if .Data.Trip}}Редактирование похода{{else}}Новый поход{{end}}{{end}}
{{define "content"}}
{{with .Data}}
<form method="post" action="{{if .Trip}}/trips/{{.Trip.ID}}/edit{{else}}/trips{{end}}" class="card form wide">
  <h1>{{if .Trip}}Редактирование похода{{else}}Новый поход{{end}}</h1>
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">

  <label>Название
    <input name="title" value="{{.Input.Title}}" required minlength="3" maxlength="120" placeholder="Кольсайские озёра на выходные">
    {{with index .Errors "title"}}<span class="err">{{.}}</span>{{end}}
  </label>

  <div class="row">
    <label>Регион
      <input name="region" value="{{.Input.Region}}" required maxlength="80" placeholder="Алматинская область">
      {{with index .Errors "region"}}<span class="err">{{.}}</span>{{end}}
    </label>
    <label>Сложность
      <select name="difficulty" required>
        {{range .Difficulties}}<option value="{{.}}"{{if eq (print .) $.Data.Input.Difficulty}} selected{{end}}>{{.Label}}</option>{{end}}
      </select>
      {{with index .Errors "difficulty"}}<span class="err">{{.}}</span>{{end}}
    </label>
  </div>

  <div class="row">
    <label>Начало
      <input type="date" name="start_date" value="{{.Input.StartDate}}" required{{if not .Trip}} min="{{.Today}}"{{end}}>
      {{with index .Errors "start_date"}}<span class="err">{{.}}</span>{{end}}
    </label>
    <label>Окончание
      <input type="date" name="end_date" value="{{.Input.EndDate}}" required>
      {{with index .Errors "end_date"}}<span class="err">{{.}}</span>{{end}}
    </label>
  </div>

  <div class="row">
    <label>Мест
      <input type="number" name="capacity" value="{{.Input.Capacity}}" required min="1" max="500">
      {{with index .Errors "capacity"}}<span class="err">{{.}}</span>{{end}}
    </label>
    <label>Взнос, ₸
      <input type="number" name="fee" value="{{.Input.Fee}}" min="0" step="1">
      {{with index .Errors "fee"}}<span class="err">{{.}}</span>{{end}}
    </label>
  </div>

  <label>Место и время сбора
    <input name="meeting_point" value="{{.Input.MeetingPoint}}" maxlength="200" placeholder="Сайран, 6:00">
    {{with index .Errors "meeting_point"}}<span class="err">{{.}}</span>{{end}}
  </label>

  <label>Описание
    <textarea name="description" rows="8" maxlength="5000" placeholder="Маршрут, что взять, кому подойдёт">{{.Input.Description}}</textarea>
    {{with index .Errors "description"}}<span class="err">{{.}}</span>{{end}}
  </label>

  <div class="actions">
    <button class="btn">{{if .Trip}}Сохранить{{else}}Создать черновик{{end}}</button>
    <a href="{{if .Trip}}/trips/{{.Trip.ID}}{{else}}/trips{{end}}">Отмена</a>
  </div>
</form>
{{end}}
{{end}}
