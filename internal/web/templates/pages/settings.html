{{define "title"}}Настройки{{end}}
{{define "content"}}
{{with .Data}}
<form method="post" action="/me/name" class="card form">
  <a class="back" href="/me">← Профиль</a>
  <h1>Настройки</h1>
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
  <label>Имя
    <input name="name" value="{{.Name}}" required minlength="2" maxlength="60" autocomplete="name">
    {{with index .Errors "name"}}<span class="err">{{.}}</span>{{end}}
  </label>
  <p class="muted small">Имя видят участники ваших встреч и все, кто откроет вашу страницу.</p>
  <button class="btn">Сохранить имя</button>
</form>

<form method="post" action="/me/password" class="card form">
  <h2>Смена пароля</h2>
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
  <input type="email" name="email" value="{{$.User.Email}}" autocomplete="username" hidden>
  <label>Текущий пароль
    <input type="password" name="current" required autocomplete="current-password">
    {{with index .Errors "current"}}<span class="err">{{.}}</span>{{end}}
  </label>
  <label>Новый пароль
    <input type="password" name="password" required minlength="8" autocomplete="new-password">
    {{with index .Errors "password"}}<span class="err">{{.}}</span>{{end}}
  </label>
  <label>Новый пароль ещё раз
    <input type="password" name="password2" required autocomplete="new-password">
    {{with index .Errors "password2"}}<span class="err">{{.}}</span>{{end}}
  </label>
  <p class="muted small">После смены пароля на всех остальных устройствах нужно будет войти заново.</p>
  <button class="btn">Сменить пароль</button>
</form>
{{end}}
{{end}}
